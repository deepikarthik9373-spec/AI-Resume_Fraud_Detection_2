<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Fraud Detection Result</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(135deg,
                #eef2ff,
                #e0f2fe,
                #f5f3ff);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        /* Main Card */
        .container {
            width: 100%;
            max-width: 650px;

            background: white;

            border-radius: 25px;

            padding: 45px 40px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(79, 70, 229, 0.20);

            border: 1px solid #e5e7eb;
        }

        /* Header */
        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 34px;

            background:
                linear-gradient(
                    90deg,
                    #4f46e5,
                    #7c3aed,
                    #2563eb
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 12px;
        }

        .subtitle {
            color: #64748b;
            font-size: 16px;
        }

        /* Resume Name */
        .resume-box {
            background: #eff6ff;

            border-left: 5px solid #2563eb;

            padding: 15px;

            border-radius: 12px;

            margin: 25px 0;

            color: #1e40af;

            font-size: 16px;
        }

        .resume-name {
            font-weight: bold;
            color: #4338ca;
        }

        /* Score Circle */
        .score-circle {
            width: 190px;
            height: 190px;

            margin: 25px auto;

            border-radius: 50%;

            background:
                conic-gradient(
                    #10b981 0deg,
                    #10b981 0deg,
                    #d1fae5 0deg,
                    #d1fae5 360deg
                );

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        .score-circle::before {
            content: "";

            position: absolute;

            width: 155px;
            height: 155px;

            background: white;

            border-radius: 50%;
        }

        .score {
            position: relative;

            font-size: 52px;

            font-weight: bold;

            color: #059669;
        }

        /* Risk Status */
        .risk {
            display: inline-block;

            padding: 12px 28px;

            border-radius: 30px;

            background: #dcfce7;

            color: #15803d;

            font-size: 24px;

            font-weight: bold;

            margin: 10px 0 15px;

            border: 2px solid #86efac;
        }

        /* Description */
        .description {
            color: #64748b;

            font-size: 16px;

            margin-bottom: 30px;
        }

        /* Information Cards */
        .info-container {
            display: flex;

            gap: 15px;

            justify-content: center;

            margin-bottom: 30px;
        }

        .info-card {
            flex: 1;

            padding: 18px;

            border-radius: 15px;

            background: #f8fafc;

            border: 1px solid #e2e8f0;
        }

        .info-card h3 {
            color: #475569;

            font-size: 14px;

            margin-bottom: 8px;
        }

        .info-card p {
            color: #4f46e5;

            font-size: 18px;

            font-weight: bold;
        }

        /* Button */
        .button {
            display: inline-block;

            padding: 14px 30px;

            border-radius: 12px;

            text-decoration: none;

            color: white;

            font-size: 16px;

            font-weight: bold;

            background:
                linear-gradient(
                    90deg,
                    #4f46e5,
                    #7c3aed
                );

            box-shadow:
                0 8px 20px rgba(79, 70, 229, 0.30);

            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 25px rgba(79, 70, 229, 0.40);
        }

        /* Footer */
        .footer {
            margin-top: 25px;

            color: #94a3b8;

            font-size: 13px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 27px;
            }

            .score-circle {
                width: 160px;
                height: 160px;
            }

            .score-circle::before {
                width: 130px;
                height: 130px;
            }

            .score {
                font-size: 44px;
            }

            .risk {
                font-size: 20px;
            }

            .info-container {
                flex-direction: column;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">

            <h1>AI Resume Fraud Detection</h1>

            <p class="subtitle">
                AI-powered resume authenticity analysis
            </p>

        </div>


        <!-- Resume Name -->
        <div class="resume-box">

            📄 Resume:

            <span class="resume-name">
                {{ filename }}
            </span>

        </div>


        <!-- Score -->
        <div class="score-circle">

            <div class="score">
                {{ score }}%
            </div>

        </div>


        <!-- Risk Status -->
        <div class="risk">

            {{ result }}

        </div>


        <!-- Description -->
        <p class="description">

            Fraud Risk Score

        </p>


        <!-- Information Cards -->
        <div class="info-container">

            <div class="info-card">

                <h3>Analysis Type</h3>

                <p>AI Based</p>

            </div>


            <div class="info-card">

                <h3>Risk Score</h3>

                <p>{{ score }}%</p>

            </div>


            <div class="info-card">

                <h3>Status</h3>

                <p>{{ result }}</p>

            </div>

        </div>


        <!-- Button -->
        <a href="/" class="button">

            🔄 Analyze Another Resume

        </a>


        <!-- Footer -->
        <div class="footer">

            AI Resume Fraud Detection System

        </div>

    </div>

</body>
</html>
